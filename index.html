<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Letradeiro: jogo diário de formar palavras em português." />
    <!-- Cor da barra do navegador no Android -->
    <meta name="theme-color" content="#f73fae" />
    <title>Letradeiro Diário</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=2.1" />
    <script src="vendor/confetti.browser.js?v=1.6.0" defer></script>
    <script src="script.js?v=2.1" defer></script>
  </head>
  <body>
    <header class="barra-titulo">
      <h1>Letradeiro</h1>
      <button type="button" class="btn-tema" id="btn-tema" aria-label="Alternar tema">🌗</button>
    </header>

    <main class="game-container" id="jogo">
      <div id="palavra-atual" aria-live="polite"></div>

      <div class="wheel" id="wheel" role="group" aria-label="Letras do desafio"></div>

      <div class="controles">
        <button type="button" id="btn-apagar">Apagar</button>
        <button type="button" id="btn-mix" class="btn-mix">Mix</button>
        <button type="button" id="btn-enviar" class="btn-enviar">Enviar</button>
      </div>

      <div id="mensagem" role="status" aria-live="polite">&nbsp;</div>

      <section class="descobertas" aria-label="Palavras do desafio">
        <h2><span id="count">0</span> de <span id="total">…</span></h2>
        <div class="progress-container">
          <div id="progress-bar"></div>
        </div>
        <ul id="lista"></ul>
      </section>

      <footer class="rodape">
        <button type="button" id="btn-gabarito" class="btn-secundario">Ver gabarito de ontem</button>
        <br />
        <button type="button" id="btn-abrir-reset" class="btn-secundario">Resetar desafio de hoje</button>
        <br />
        <a class="link-fonte" href="https://github.com/saulopz/letradeiro" target="_blank" rel="noopener">
          Código-fonte (software livre, AGPL-3.0)
        </a>
      </footer>
    </main>

    <section id="modal-gabarito" class="modal" hidden>
      <h2>Gabarito de Ontem</h2>
      <div id="lista-gabarito" class="gabarito-grid"></div>
      <button type="button" id="btn-fechar-gabarito" class="btn-voltar">Voltar ao Jogo</button>
    </section>

    <section id="modal-reset" class="modal" hidden>
      <h2>Resetar Desafio</h2>
      <!-- Um <form> de verdade: Enter envia e o gerenciador de senhas reconhece o campo -->
      <form id="form-reset">
        <p class="texto-suave">
          Digite a senha de administração para sortear um novo desafio de hoje:
        </p>
        <input type="password" id="senha-reset" placeholder="Senha" class="input-password"
               autocomplete="current-password" aria-label="Senha de administração" required />
        <div class="botoes-modal">
          <button type="button" id="btn-cancelar-reset">Cancelar</button>
          <button type="submit" class="btn-perigo">Resetar</button>
        </div>
      </form>
    </section>
  </body>
</html>
